[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dico-nli-english"
version = "0.1.0"
description = "Reversal-aware English baseline for SemEval 2027 Task 2 DiCo-NLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "protobuf>=5,<7",
  "scikit-learn>=1.5,<2",
  "sentencepiece>=0.2,<0.3",
  "torch>=2.4",
  "transformers>=4.48,<5",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
dico-train = "dico_nli.train:main"
dico-predict = "dico_nli.predict:main"
dico-score = "dico_nli.score:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
